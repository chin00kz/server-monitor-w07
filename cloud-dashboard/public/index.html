<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Infrastructure Monitor</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<section id="login-view" class="login panel">
  <div class="kicker">INFRASTRUCTURE MONITOR</div><h1>Authorized access</h1>
  <form id="login-form"><div class="field"><label for="password">Shared password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">Sign in</button><div id="login-error" class="error" role="alert"></div></form>
</section>
<main id="dashboard-view" class="shell hidden">
  <header class="topbar"><div class="identity"><div class="kicker">INFRASTRUCTURE MONITOR</div><div class="host-line"><h1 id="node-name">Unknown host</h1><span id="connection-state" class="state-badge offline"><i></i><span id="connection-label">OFFLINE</span></span></div><div class="host-meta"><span>Uptime <strong id="uptime">Unavailable</strong></span><span>Updated <strong id="last-update">Never</strong></span></div></div><button id="logout" class="ghost" type="button">Sign Out</button></header>
  <div class="primary-grid">
    <section class="panel network-panel"><div class="panel-head"><h2>NETWORK</h2><span id="network-warning" class="panel-note hidden">NO CONNECTION</span></div><div class="network-list"><div class="network-row"><strong>Starlink Mini</strong><span id="starlink" class="status neutral"><i></i>Unknown</span></div><div class="network-row"><strong>Dialog Ethernet</strong><span id="dialog" class="status neutral"><i></i>Unknown</span></div></div></section>
    <section class="panel power-panel"><div class="panel-head"><h2>POWER</h2></div><div class="power-value"><strong id="battery-percent">—</strong><span id="power-state" class="neutral">Unavailable</span></div><div id="battery-bar" class="bar neutral" role="progressbar" aria-label="Battery charge" aria-valuemin="0" aria-valuemax="100"><i></i></div><div id="battery-status" class="detail">Battery telemetry unavailable</div></section>
    <section class="panel resources-panel"><div class="panel-head"><h2>RESOURCES</h2></div><div class="metrics"><div class="metric"><div class="metric-head"><span>CPU</span><strong id="cpu">—</strong></div><div id="cpu-bar" class="bar neutral"><i></i></div></div><div class="metric"><div class="metric-head"><span>RAM</span><strong id="ram">—</strong></div><div id="ram-bar" class="bar neutral"><i></i></div></div><div class="metric"><div class="metric-head"><span>DISK</span><strong id="disk">—</strong></div><div id="disk-bar" class="bar neutral"><i></i></div></div></div></section>
  </div>
  <section class="panel services-panel"><div class="panel-head"><h2>SERVICES</h2><strong id="service-count" class="neutral">0/5 Unknown</strong></div><div id="services" class="service-list"></div></section>
</main>
<script src="/dashboard.js"></script>
</body>
</html>
