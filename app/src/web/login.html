<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>server-monitor · login</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: dark;
  --bg: #080b10;
  --panel: #10161e;
  --panel-raised: #151d27;
  --line: #273544;
  --text: #e8edf2;
  --mute: #8292a3;
  --acc: #f28c28;
  --acc-soft: #ffb45e;
  --red: #e16b67;
  --font: "Segoe UI", Ubuntu, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(71, 91, 108, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(71, 91, 108, .035) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--text);
  font: 15px/1.5 var(--font);
}
.card {
  width: min(360px, 100%);
  padding: 28px 24px 24px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: rgba(16, 22, 30, .96);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}
.brand-mark {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  background: var(--acc);
  color: #1b1209;
  font-weight: 900;
  font-size: 17px;
  clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%);
}
.brand-name {
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.brand-sub {
  margin-top: 2px;
  color: var(--mute);
  font-size: .68rem;
  letter-spacing: .1em;
  text-transform: uppercase;
}
h1 {
  margin: 0 0 6px;
  font-size: 1.15rem;
  font-weight: 650;
}
.lead {
  margin: 0 0 18px;
  color: var(--mute);
  font-size: .84rem;
}
label {
  display: block;
  margin-bottom: 6px;
  color: var(--mute);
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}
input, button {
  width: 100%;
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--panel-raised);
  color: inherit;
  font: inherit;
}
input:focus, button:focus {
  outline: 2px solid rgba(242, 140, 40, .55);
  outline-offset: 2px;
}
button {
  margin-top: 14px;
  border-color: rgba(242, 140, 40, .55);
  background: var(--acc);
  color: #221509;
  font-weight: 750;
  cursor: pointer;
}
button:hover { background: var(--acc-soft); }
#e {
  min-height: 1.2em;
  margin-top: 10px;
  color: var(--red);
  font-size: .85rem;
}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">U</div>
    <div>
      <div class="brand-name">Ubuntu Monitor</div>
      <div class="brand-sub">Infrastructure console</div>
    </div>
  </div>
  <h1>Sign in</h1>
  <p class="lead">Private Tailscale access to workstation-07-5d.</p>
  <label for="p">Password</label>
  <input id="p" type="password" name="password" placeholder="Dashboard password" autocomplete="current-password" autofocus>
  <button type="submit">Log in</button>
  <div id="e" role="alert"></div>
</form>
<script>
f.onsubmit = async (ev) => {
  ev.preventDefault();
  const r = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: p.value})
  });
  if (r.ok) { location = "/"; return; }
  e.textContent =
    r.status === 429 ? "Too many attempts. Try again later." :
    r.status === 503 ? "No password set yet." :
    "Wrong password.";
  p.value = "";
  p.focus();
};
</script>
</body>
</html>
